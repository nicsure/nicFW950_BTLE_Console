<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nicFW950 BLE Console</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>nicFW950 BLE Console</h1>
        <div class="header-meta">
          <span class="version" title="Application version">V1.03</span>
          <div class="theme-controls" role="group" aria-label="Color theme">
            <button id="light-mode" type="button" aria-pressed="false">Light mode</button>
            <button id="dark-mode" type="button" aria-pressed="false">Dark mode</button>
          </div>
          <span id="status" class="status disconnected">Disconnected</span>
        </div>
      </header>
      <div class="toolbar">
        <button id="connect" type="button">Connect</button>
        <button id="disconnect" type="button" disabled>Disconnect</button>
        <button id="clear" type="button">Clear</button>
      </div>
      <section class="connection-details" aria-label="Bluetooth connection details">
        <strong>Connection details</strong>
        <p id="connection-detail" role="status" aria-live="polite">Disconnected. Select Connect to choose a Bluetooth device.</p>
      </section>
      <pre id="terminal" aria-live="polite"></pre>
      <form id="send-form" autocomplete="off">
        <input id="command" type="text" placeholder="Enter command" spellcheck="false" disabled />
        <button id="send" type="submit" disabled>Send</button>
      </form>
    </main>
    <script>
      (() => {
        const lightButton = document.getElementById("light-mode");
        const darkButton = document.getElementById("dark-mode");
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)");
        let manuallySelected = false;

        function applyTheme(theme) {
          document.documentElement.dataset.theme = theme;
          lightButton.setAttribute("aria-pressed", String(theme === "light"));
          darkButton.setAttribute("aria-pressed", String(theme === "dark"));
        }

        try {
          const savedTheme = localStorage.getItem("nicfw950-theme");
          if (savedTheme === "light" || savedTheme === "dark") {
            manuallySelected = true;
            applyTheme(savedTheme);
          } else {
            applyTheme(systemTheme.matches ? "dark" : "light");
          }
        } catch {
          applyTheme(systemTheme.matches ? "dark" : "light");
        }

        lightButton.addEventListener("click", () => {
          manuallySelected = true;
          applyTheme("light");
          try { localStorage.setItem("nicfw950-theme", "light"); } catch {}
        });
        darkButton.addEventListener("click", () => {
          manuallySelected = true;
          applyTheme("dark");
          try { localStorage.setItem("nicfw950-theme", "dark"); } catch {}
        });

        systemTheme.addEventListener("change", (event) => {
          if (!manuallySelected) applyTheme(event.matches ? "dark" : "light");
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
